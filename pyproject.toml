[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caugjam"
version = "0.1.0"
description = "Canonical augmentation (isomorph-free generation) for JAM chains"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Edgar Castillo (Independent Researcher)", email = "edgar.castillo.sci@gmail.com"},
]
dependencies = [
    "numpy",
    "canonJAM @ git+https://github.com/edgar-castillo-sci/canonJAM.git@v1.2.1",
]
keywords = ["JAM", "canonical augmentation", "isomorph-free generation", "2D materials", "honeycomb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/edgar-castillo-sci/caugJAM"
Documentation = "https://github.com/edgar-castillo-sci/caugJAM#readme"
Source = "https://github.com/edgar-castillo-sci/caugJAM"

[project.optional-dependencies]
tests = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["caugjam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "isomorph_free_experiments",
    "*.egg",
    ".*",
    "__pycache__",
    "build",
    "dist",
]
